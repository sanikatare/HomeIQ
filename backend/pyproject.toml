[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "homeiq-backend"
version = "0.1.0"
description = "HomeIQ — Production-Grade Modular Monolith & Multi-Agent Household Intelligence Backend"
readme = "../README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
  { name = "HomeIQ Principal Architecture Team" }
]
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.30.6,<1.0.0",
  "pydantic>=2.9.0,<3.0.0",
  "pydantic-settings>=2.5.2,<3.0.0",
  "sqlalchemy[asyncio]>=2.0.35,<3.0.0",
  "asyncpg>=0.29.0,<1.0.0",
  "aiosqlite>=0.20.0,<1.0.0",
  "alembic>=1.13.3,<2.0.0",
  "pgvector>=0.3.5,<1.0.0",
  "google-genai>=0.3.0,<2.0.0",
  "httpx>=0.27.2,<1.0.0",
  "tenacity>=9.0.0,<10.0.0",
  "structlog>=24.4.0,<25.0.0",
  "python-multipart>=0.0.12,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3,<9.0.0",
  "pytest-asyncio>=0.24.0,<1.0.0",
  "pytest-cov>=5.0.0,<6.0.0",
  "ruff>=0.6.8,<1.0.0",
  "mypy>=1.11.2,<2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "ASYNC", "S"]
ignore = ["S101", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
